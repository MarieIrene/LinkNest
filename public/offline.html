<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#164E63">
  <meta name="robots" content="noindex">
  <title>You're offline | LinkNest</title>
  <!-- Self-contained on purpose: no scripts or stylesheets to download, so it always shows without internet. -->
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px;text-align:center;background:#164E63;color:#fff;
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
    h1{margin:36px 0 0;font-size:30px;line-height:1.2}
    p{margin:12px 0 0;max-width:24rem;color:rgba(255,255,255,.78);line-height:1.6}
    button{margin-top:32px;border:0;border-radius:999px;padding:13px 28px;font:inherit;font-weight:600;
      background:#5EEAD4;color:#0E3443;box-shadow:0 4px 0 0 #0E3443;cursor:pointer}
    button:active{transform:translateY(4px);box-shadow:none}
    button:focus-visible{outline:2px solid #5EEAD4;outline-offset:4px}
  </style>
</head>
<body>
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#5EEAD4"/><rect x="7" y="9" width="18" height="5" rx="2.5" fill="#164E63"/><rect x="7" y="18" width="18" height="5" rx="2.5" fill="#164E63" opacity=".55"/></svg>
    LinkNest
  </div>
  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#5EEAD4" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="margin-top:40px">
    <path d="M2 8.8a15 15 0 0 1 20 0M5 12.6a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/>
  </svg>
  <h1>You're offline</h1>
  <p>Check your internet connection. LinkNest will be right here when you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
